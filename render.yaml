services:
  - type: web
    name: botolafantasy
    env: node
    plan: free
    buildCommand: 'npm ci'
    startCommand: 'node server.js'
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APIFOOTBALL_API_KEY
        sync: false
      - key: APIFOOTBALL_LEAGUE_ID
        sync: false
      - key: APIFOOTBALL_SEASON
        sync: false
      - key: APIFOOTBALL_TIMEZONE
        value: Africa/Casablanca
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
    previews:
      generation: automatic
